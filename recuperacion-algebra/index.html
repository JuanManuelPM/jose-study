function countDone(qs=ALL){return qs.filter(q=>state.responses[q.id]?.done).length}
function total(){return {done:countDone(),first:ALL.filter(q=>state.responses[q.id]?.first).length,review:ALL.filter(q=>state.responses[q.id]?.review).length}}
function setView(v){view=v;$("home").hidden=v!=="home";$("focus").hidden=v!=="focus";$("report").hidden=v!=="report";if(gateTimer){clearTimeout(gateTimer);gateTimer=null;}window.scrollTo(0,0);updateGlobal()}
function updateGlobal(){let n=countDone();$("globalNum").textContent=n+" / 48";$("globalLine").style.width=(100*n/48)+"%"}
function showHome(){setView("home");$("topics").innerHTML=BANK.map(s=>{
 const done=countDone(ALL.filter(q=>q.topic===s.id));
 return '<button type="button" class="topic-btn" data-topic="'+esc(s.id)+'"><span class="topic-name">'+esc(s.name)+'</span><span class="topic-num">'+done+' / 12</span><span class="topic-arrow" aria-hidden="true">↗</span></button>';
}).join("");
$("topics").querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>openTopic(b.dataset.topic)));
$("resultsButton").hidden=countDone()===0;
}
function openTopic(id){
 const qs=ALL.filter(q=>q.topic===id);
 if(!qs.length)return;
 const next=qs.find(q=>!record(q).done)||qs[0];
 openExercise(ALL.indexOf(next));
}
function openExercise(idx){
 if(idx<0||idx>=ALL.length)return;
 state.position=idx;state.chosen=null;state.hint=0;state.started=Date.now();notice="";noticeBad=false;persist();setView("focus");renderExercise();
}
function renderExercise(){
 const q=ALL[state.position],r=record(q);
 $("focusTitle").textContent=q.section.name;
 $("focusIndex").textContent=(q.local+1)+" / 12";
 $("focusLine").style.width=((q.local+1)/12*100)+"%";
 $("question").textContent=q.question;
 $("answers").innerHTML=q.options.map((opt,i)=>{
 let selected=state.chosen===i||(r.done&&r.selected===i);
 let cls=r.done&&i===q.answer?"correct":(!r.done&&r.tries>0&&r.selected===i&&state.chosen===null?"incorrect":(selected?"selected":""));
 return '<button class="answer '+cls+'" type="button" data-option="'+i+'" '+(r.done?"disabled":"")+' aria-pressed="'+(selected?"true":"false")+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span class="value">'+esc(opt)+'</span></button>';
 }).join("");
 $("answers").querySelectorAll("[data-option]").forEach(b=>b.addEventListener("click",()=>select(Number(b.dataset.option))));
 const fb=$("feedback");
 fb.hidden=!notice;fb.textContent=notice;fb.className="feedback"+(noticeBad?" bad":"");
 const hint=$("hintText");
 hint.hidden=state.hint<1;
 hint.textContent=state.hint>0?q.hints.slice(0,state.hint).join(" · "):"";
 const ctrl=$("controls");
 if(r.done){
  ctrl.innerHTML='<button class="primary" id="nextButton" type="button">'+(q.local===11?"Topics":"Next →")+'</button>';
  $("nextButton").onclick=next;
 }else{
  const skip=r.tries>=2?'<button class="secondary" id="skipButton" type="button">Skip</button>':"";
  ctrl.innerHTML='<button class="primary" id="checkButton" type="button">Check</button><button class="secondary" id="hintButton" type="button">Hint'+(state.hint>0?" "+state.hint+"/3":"")+'</button>'+skip;
  $("checkButton").onclick=check;
  $("hintButton").onclick=revealHint;
  if($("skipButton"))$("skipButton").onclick=skip;
  updateGate();
 }
}
function updateGate(){
 if(view!=="focus")return;
 const b=$("checkButton");if(!b)return;
 const remaining=Math.max(0,10000-(Date.now()-state.started));
 b.disabled=state.chosen===null||remaining>0;
 b.textContent=remaining>0?"Check · "+Math.ceil(remaining/1000):"Check";
 if(remaining>0){gateTimer=setTimeout(updateGate,Math.min(1000,remaining+60));}
}
function select(i){
 if(record(ALL[state.position]).done)return;
 state.chosen=i;notice="";noticeBad=false;persist();renderExercise();
}
function check(){
 const q=ALL[state.position],r=record(q);
 if(r.done||state.chosen===null||Date.now()-state.started<10000)return;
 r.tries=(r.tries||0)+1;r.selected=state.chosen;
 r.hint=Math.max(r.hint||0,state.hint);
 if(r.tries>1||r.hint>0)r.review=true;
 if(state.chosen===q.answer){r.done=true;r.first=r.tries===1&&r.hint===0;notice="Correct";noticeBad=false;}
 else{r.review=true;notice="Try again";noticeBad=true;state.chosen=null;}
 state.responses[q.id]=r;persist();updateGlobal();renderExercise();
}
function revealHint(){
 const q=ALL[state.position],r=record(q);if(r.done)return;
 state.hint=Math.min(3,state.hint+1);
 r.hint=Math.max(r.hint||0,state.hint);r.review=true;state.responses[q.id]=r;
 notice="";persist();renderExercise();
}
function skip(){
 const q=ALL[state.position],r=record(q);if(r.done)return;
 state.responses[q.id]={...r,done:true,first:false,review:true,skipped:true,selected:null};
 persist();next();
}
function next(){
 const q=ALL[state.position];
 if(q.local===11){showHome();return;}
 openExercise(state.position+1);
}
function summaryText(){
 const t=total();
 const lines=BANK.map(s=>s.name+": "+countDone(ALL.filter(q=>q.topic===s.id))+"/12");
 const review=ALL.filter(q=>state.responses[q.id]?.review).map(q=>q.id).join(", ")||"None";
 return ["JOSÉ · ALGEBRA","48 exercises",...lines,"","Completed: "+t.done+"/48","First attempt without hints: "+t.first,"Review: "+t.review,"Review IDs: "+review,"Date: "+new Date().toLocaleDateString("es-AR")].join("\n");
}
function showReport(){
 setView("report");
 const t=total();
 $("reportTotal").innerHTML=t.done+'<small> / 48</small>';
 $("reportTopics").innerHTML=BANK.map(s=>'<div class="report-line"><span>'+esc(s.name)+'</span><span>'+countDone(ALL.filter(q=>q.topic===s.id))+'/12</span></div>').join("")+
 '<div class="report-line"><span>First try</span><span>'+t.first+'</span></div><div class="report-line"><span>Review</span><span>'+t.review+'</span></div>';
 $("reportNote").textContent="";
 $("copyResults").textContent="Copy results";
}
async function copyResults(){
 let s=summaryText();
 try{await navigator.clipboard.writeText(s);$("copyResults").textContent="Copied";}
 catch(e){let a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();$("copyResults").textContent=ok?"Copied":"Copy failed";}
}
$("backButton").onclick=showHome;
$("resultsButton").onclick=showReport;
$("reportBack").onclick=showHome;
$("returnHome").onclick=showHome;
$("copyResults").onclick=copyResults;
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&view!=="home"){showHome();return;}
 if(view!=="focus")return;
 const q=ALL[state.position],r=record(q);
 if(!r.done&&["1","2","3","4"].includes(e.key)){select(Number(e.key)-1);return;}
 if(e.key==="Enter"&&document.activeElement===document.body){
 if(r.done)next();else check();
 }
});
showHome();
</script>
</body></html>
