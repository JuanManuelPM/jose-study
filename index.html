/* === GOLDEN R2 · protected visual system === */
:root{
  --ui:Arial,Helvetica,sans-serif;
  --math:"Cambria Math","STIX Two Math","Times New Roman",serif;
  --bg:#f3f1eb;--ink:#111315;--muted:#6f7273;--line:rgba(17,19,21,.14);
  --soft:rgba(255,255,255,.34);--green:#5d9f69;--red:#b53b36;--pending:#8b7355;
  --ease:cubic-bezier(.22,.78,.2,1);--fast:180ms;--mid:320ms;
}
html,body,button,input,a{font-family:var(--ui)}
body{font-size:14px;line-height:1.45}
.page,.calendar-page,.river-page{width:min(1160px,100%);padding:clamp(14px,3vw,32px)}
.back{font-family:var(--ui);font-size:27px;font-weight:400;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;transition:background var(--fast),transform var(--fast)}
@media(hover:hover){.back:hover{background:rgba(17,19,21,.055);transform:translateX(-2px)}}
.kicker{font:800 9px/1 var(--ui);letter-spacing:.16em}
.huge,.brand-name,.s-name,.big-pct,.topic-title,.r-title,.lane-title,.river-feature,.month,.year{
  font-family:var(--ui)!important;font-stretch:normal!important
}
.huge{font-size:clamp(36px,6.5vw,76px);line-height:.92;letter-spacing:-.055em;max-width:100%;word-break:normal;overflow-wrap:anywhere}
.big-pct{font-size:clamp(36px,6.1vw,72px);line-height:.92;letter-spacing:-.05em;font-weight:800;align-self:start}
.subject-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:clamp(12px,3vw,34px)}
.inner-head{align-items:flex-start}
.meta{font-family:var(--ui);font-size:10px;letter-spacing:.01em}

/* one progress language: one headline percentage, words carry local progress */
.topic-row{grid-template-columns:48px minmax(0,1fr)!important;gap:12px;min-height:84px;transition:background var(--fast),transform var(--fast)}
.topic-pct{display:none!important}
.topic-title{font-size:clamp(22px,3vw,35px);font-weight:800;line-height:1;letter-spacing:-.035em}
@property --fill{syntax:'<percentage>';inherits:true;initial-value:0%}
.word-fill{transition:--fill 520ms var(--ease)}
@media(hover:hover){.topic-row:hover{background:rgba(255,255,255,.24);transform:translateX(2px)}}

/* integrated Theory + Practice; no global Theory/Practice tabs */
.modes{display:none!important}

/* ================================================================
   JOSÉ STUDY R6 — FINAL UNIVERSAL STUDY GRAMMAR
   Build: JOS-MATH-RIVER-R8-20260826
   One typography owner + one disclosure owner + compact exercise ladder.
   ================================================================ */
:root{
  --font:Arial,Helvetica,sans-serif;
  --math:"Cambria Math","STIX Two Math","Times New Roman",serif;
  --river:#d71920;
  --youtube:#ff0033;
  --soft:rgba(17,19,21,.075);
  --safe-gap:14px;
  --ease:cubic-bezier(.2,.78,.2,1);
  --ui-display:800 clamp(42px,7.3vw,88px)/1.03 var(--font);
  --ui-topic:800 clamp(20px,2.8vw,31px)/1 var(--font);
  --ui-index:800 13px/1 var(--font);
  --ui-label:800 8px/1 var(--font);
  --lock-size:13px;
}
html{font-family:var(--font)}
body,button,a,input,textarea,select{font-family:var(--font)!important}
.huge,.brand-name,.s-name,.big-pct,.topic-title,.r-title,.river-feature,.month,.year,.calendar-month,.calendar-year,.river-match-title,.river-stat-value{font-family:var(--font)!important}

/* Header safety: accented capitals get physical headroom, not a fragile optical nudge. */
.topic-page .inner-head{padding-top:10px}
.topic-page .subject-hero{align-items:start;gap:clamp(18px,3vw,40px)}
.topic-page .subject-hero>div:first-child{min-width:0;padding-top:8px}
.topic-page .subject-hero .kicker{margin:0 0 8px;line-height:1.2}
.topic-page .huge{font:var(--ui-display)!important;padding:4px 0 5px!important;line-height:1.04!important;overflow:visible!important;letter-spacing:-.05em!important}
.topic-page .big-pct{padding-top:15px;line-height:1!important;align-self:start}
.topic-page .meta{margin-top:2px}

/* One disclosure family. Unit and exercise toggles differ only by semantic scale. */
.theory-unit-head{min-height:70px;grid-template-columns:44px 28px minmax(0,1fr) 24px!important}
.theory-unit-head .r-title{font:var(--ui-topic)!important}
.theory-unit-head .r-num{font:var(--ui-index)!important}
.theory-unit-head .chev{width:28px;height:28px;border-radius:50%;transition:background 150ms ease}
.theory-unit-head .chev svg{width:15px;height:15px;transition:transform 230ms var(--ease)}
@media(hover:hover){.theory-unit-head:hover .chev{background:rgba(17,19,21,.045)}}
.theory-content{padding-bottom:20px}
.theory-done{width:18px;height:18px;display:grid;place-items:center;color:var(--green);justify-self:end}
.theory-done svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.8}

/* Theory reads like a sheet: explanation → formula → cues → YouTube → exercises. */
.study-cue{gap:18px!important}
.cue{font-size:10.5px!important;line-height:1.45!important}
.math-sheet{margin-top:7px!important;margin-bottom:12px!important;padding-top:11px!important;padding-bottom:12px!important}
.math-system{gap:10px!important}
.brace{font-size:2.65em!important;line-height:.7!important;transform:scaleY(1.38)!important}
.system-lines{gap:5px!important}

/* YouTube is visibly actionable without becoming a giant branded card. */
.youtube-resource{
  display:inline-flex;align-items:center;gap:8px;min-height:40px;
  color:var(--ink);text-decoration:none;font:800 10px/1 var(--font);
  padding:0 11px 0 9px;margin-top:2px;
  border:1px solid rgba(17,19,21,.18);border-radius:999px;
  background:rgba(255,255,255,.13);
  transition:border-color 150ms ease,background 150ms ease,transform 150ms ease;
}
.youtube-resource .yt-brand{width:21px;height:21px;display:grid;place-items:center;flex:0 0 21px;color:var(--youtube)}
.youtube-resource .yt-brand svg{display:block;width:21px;height:21px;color:var(--youtube)}
.youtube-resource .external-link-icon{width:12px;height:12px;display:grid;place-items:center;color:var(--muted);margin-left:1px}
.youtube-resource .external-link-icon svg{width:12px;height:12px;display:block}
@media(hover:hover){.youtube-resource:hover{border-color:rgba(17,19,21,.48);background:rgba(255,255,255,.34);transform:translateY(-1px)}}
.youtube-resource:focus-visible{outline:2px solid currentColor;outline-offset:3px}

/* Exercises: current action, next lock, then future disclosure. No six-row timeline. */
.exercise-section{max-width:780px;margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.exercise-section-head{margin:0 0 4px;display:flex;align-items:center;min-height:20px}
.practice-label{font:var(--ui-label)!important;letter-spacing:.17em!important;color:var(--muted)}
.exercise-list{width:100%;border-bottom:1px solid var(--line)}

.exercise-row{border-top:1px solid var(--line)}
.exercise-head{
  width:100%;min-height:42px;border:0;background:transparent;color:inherit;padding:0;
  display:grid;grid-template-columns:30px max-content minmax(0,1fr);align-items:center;column-gap:7px;
  text-align:left;cursor:pointer;
}
.exercise-disclosure{
  width:28px;height:28px;display:grid;place-items:center;color:var(--muted);border-radius:50%;
  transition:background 150ms ease;justify-self:start;
}
.exercise-disclosure svg{display:block;width:15px;height:15px;transition:transform 230ms var(--ease)}
.exercise-row.open .exercise-disclosure svg{transform:rotate(90deg)}
@media(hover:hover){.exercise-head:hover .exercise-disclosure{background:rgba(17,19,21,.055)}}
.exercise-code{font:var(--ui-index)!important;letter-spacing:.02em;white-space:nowrap}
.exercise-state{display:inline-flex;align-items:center;gap:5px;justify-self:start;font:800 9px/1 var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.exercise-state.correct{color:var(--green)}
.exercise-state.pending{color:var(--pending)}
.exercise-state.wrong{color:var(--red)}
.exercise-row.previous .exercise-code{color:#474a4b}

/* Locked next uses the same alignment column but no fake toggle. Lock stays attached to code. */
.exercise-next{
  min-height:36px;border-top:1px solid rgba(17,19,21,.09);
  display:grid;grid-template-columns:30px max-content max-content 1fr;align-items:center;column-gap:7px;

  for(let i=0;i<42;i++){let n=i-start+1;if(n<1){let pm=m-1,py=y;if(pm<0){pm=11;py--}cells.push({n:prev+n,out:1,date:iso(py,pm,prev+n)})}else if(n>last.getDate()){let nm=m+1,ny=y;if(nm>11){nm=0;ny++}cells.push({n:n-last.getDate(),out:1,date:iso(ny,nm,n-last.getDate())})}else cells.push({n,out:0,date:iso(y,m,n)})}

  document.getElementById("back").onclick=()=>go("#home");document.getElementById("prev").onclick=()=>shiftMonth(-1);document.getElementById("next").onclick=()=>shiftMonth(1)
}
