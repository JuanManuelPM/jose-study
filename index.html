function parseNum(v){v=String(v??"").trim().replaceAll("−","-").replace(",",".");if(!v)return NaN;if(/^[-+]?\d+(?:\.\d+)?\s*\/\s*[-+]?\d+(?:\.\d+)?$/.test(v)){let [a,b]=v.split('/').map(Number);return b? a/b:NaN}let n=Number(v);return Number.isFinite(n)?n:NaN}
function eqVal(v,a){if(typeof a==="number"){const n=parseNum(v);return Number.isFinite(n)&&Math.abs(n-a)<1e-6}return String(v??"").trim().replaceAll("−","-").toLowerCase()===String(a).trim().replaceAll("−","-").toLowerCase()}
function evalExercise(ex,a){if(ex.type==="choice")return Number(a.response?.[0])===Number(ex.correct);let r=(a.response||[]).slice(0,ex.answers.length);if(r.length<ex.answers.length)return false;if(ex.order==="any"&&ex.answers.every(x=>typeof x==="number")){let x=r.map(parseNum).sort((u,v)=>u-v),y=[...ex.answers].sort((u,v)=>u-v);return x.every((n,i)=>Number.isFinite(n)&&Math.abs(n-y[i])<1e-6)}return ex.answers.every((ans,i)=>eqVal(r[i],ans))}

function subjectProgressInfo(s,mathStats){

  const st=s.id==="math"?mathStats:{correct:0,total:0,pct:0};
  if(st.pct<=0)return {kind:"new",pct:0,label:"NEW",stats:st};
  if(st.pct>=100)return {kind:"done",pct:100,label:"DONE",stats:st};
  return {kind:"progress",pct:st.pct,label:`${st.pct}%`,stats:st};

function nextPartialForSubject(subjectId){
  const now=new Date();
  const rows=DATA.events.filter(e=>{
    if(e.type!=="exam"||!/parcial/i.test(e.title||""))return false;
    if(e.subjectId&&e.subjectId!==subjectId)return false;
    if(!e.subjectId&&subjectId!=="math")return false;
    const time=/^\d{2}:\d{2}$/.test(e.time||"")?e.time:"23:59";
    const when=new Date(`${e.date}T${time}:00`);
    return Number.isFinite(when.getTime())&&when>now;
  }).sort((a,b)=>`${a.date}T${a.time||"23:59"}`.localeCompare(`${b.date}T${b.time||"23:59"}`));
  if(!rows.length)return null;
  const e=rows[0],d=new Date(`${e.date}T00:00:00`),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((d-today)/86400000);
  const left=days===0?"HOY":days===1?"MAÑANA":`${days} DÍAS`;
  return {...e,left};
}

          <div class="river-position-row"><div class="river-position-name">Sudamericana</div><div class="river-position-value">Eliminado</div><div class="river-position-sub">Octavos · Santa Fe avanzó por penales.</div></div>
          <div class="river-position-row"><div class="river-position-name">Anual</div><div class="river-position-value">${r.annual.pos}.º · ${r.annual.pts}</div><div class="river-position-sub">${esc(r.annual.note)}</div></div>
        </div>
      </div>
    </section>

    <section class="river-disclosures">
      <details><summary><span class="river-disclosure-chev">${SVG.chev}</span><span>Últimos 5 partidos</span><span class="river-disclosure-meta">${formStates.join(" · ")}</span></summary><div class="river-details-body">${formRows}</div></details>
      <details><summary><span class="river-disclosure-chev">${SVG.chev}</span><span>Competiciones 2026</span><span class="river-disclosure-meta">${r.competitions.length} torneos</span></summary><div class="river-details-body">${compRows}</div></details>
      <details><summary><span class="river-disclosure-chev">${SVG.chev}</span><span>Tabla alrededor de River</span><span class="river-disclosure-meta">Clausura</span></summary><div class="river-details-body">${tableRows}<div class="river-section-note" style="margin-top:9px">${esc(r.clausura.note)}</div></div></details>
      <details><summary><span class="river-disclosure-chev">${SVG.chev}</span><span>Plantel actual</span><span class="river-disclosure-meta">DT ${esc(r.coach)}</span></summary><div class="river-details-body">${squad}</div></details>
    </section>

    <div class="river-sources"><b>Snapshot estático · 27 AGO.</b> Resultado de Santa Fe confirmado por CONMEBOL; próximo partido y fixture inmediato verificados en River. No intenta reemplazar el vivo: resume qué cambió y qué viene después.</div>
  </main>`;
  document.getElementById("back").onclick=()=>go("#home")
}
function route(){settleDue();let p=(location.hash||"#home").slice(1).split('/').filter(Boolean);if(!p.length||p[0]==="home")return home();if(p[0]==="calendar")return calendar();if(p[0]==="river")return river(p[1]||"now");if(p[0]==="subject"&&p[1]==="math")return subjectView();if(p[0]==="topic"){let t=topic(p[1]);if(t)return topicView(t)}go("#home")}
window.addEventListener("hashchange",route);window.addEventListener("keydown",e=>{let editable=e.target.matches?.("input,textarea,select,[contenteditable=true]");if(e.key==="Escape"){if(editable){e.target.blur();return}if(location.hash&&!location.hash.includes("#home")){history.back()}}});if(!location.hash)location.hash="#home";else route();
</script></body></html>
