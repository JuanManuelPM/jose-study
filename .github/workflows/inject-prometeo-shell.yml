name: Inject Prometeo Capture Shell
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/inject-prometeo-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject shared Prometeo shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='<script type="module" src="https://juanmanuelpm.github.io/prometeo/shared/prometeo-shell/v2/prometeo-shell.js?v=2" data-prometeo-shell></script>'
          old=re.compile(r'<script\b[^>]*data-prometeo-shell[^>]*>\s*</script>',re.I)
          if marker in text:
              print('Prometeo shell v2 already present')
              raise SystemExit(0)
          if old.search(text):
              text=old.sub(marker,text)
          else:
              i=text.lower().rfind('</body>')
              text=text[:i]+marker+'\n'+text[i:] if i>=0 else text+'\n'+marker+'\n'
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'shell: inject Prometeo Capture v2'
          git pull --rebase origin main
          git push origin HEAD:main
