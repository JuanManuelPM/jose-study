name: Keep Prometeo Global Shell
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/prometeo-global-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-global-shell
  cancel-in-progress: false
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject owner shell into every HTML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          marker='<script type="module" src="/prometeo/shared/prometeo-shell/v1/prometeo-shell.js?v=1" data-prometeo-shell></script>'
          changed=0
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'data-prometeo-shell' in text:
                  continue
              i=text.lower().rfind('</body>')
              text=text[:i]+marker+'\n'+text[i:] if i>=0 else text+'\n'+marker+'\n'
              p.write_text(text,encoding='utf-8')
              changed+=1
          print('Injected',changed,'HTML files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' 2>/dev/null || git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'shell: keep Prometeo global voice notes enabled'
          git push
