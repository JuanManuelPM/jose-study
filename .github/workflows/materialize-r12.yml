name: Materialize José Study R12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-r12.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact R12 publish artifact
        shell: bash
        run: |
          set -euo pipefail
          cat .r12xz/00.b64 .r12xz/01.b64 .r12xz/02.b64 | base64 -d > /tmp/r12.xz
          xz -dc /tmp/r12.xz > index.html
          echo '72477881f29f64eb51685be69ef61c12fadb18a9cf6a42940d3e21eae89d6173  index.html' | sha256sum -c -
          grep -q 'JOS-MATH-RIVER-R12-20260827' index.html
      - name: Publish and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -r .r12xz
          if [ -d .r12parts ]; then git rm -r .r12parts; fi
          git rm .github/workflows/materialize-r12.yml
          git commit -m 'release: publish José Study R12'
          git push origin HEAD:main
